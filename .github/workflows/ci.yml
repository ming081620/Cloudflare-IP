name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  worker:
    name: Worker check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      # AGENTS.md has required this since the start; CI never actually ran it.
      - name: Test
        run: npm test

      # The icon subset is generated, so a stale checked-in copy would silently drop glyphs.
      - name: Icon subset is up to date
        run: |
          npm run build:icons
          git diff --exit-code -- public/vendor

  openwrt-static:
    name: OpenWrt static checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shell syntax
        run: |
          sh -n openwrt-packages/cf-ip-speed-client/files/usr/bin/cf-ip-speed-client
          sh -n openwrt-packages/cf-ip-speed-client/files/etc/init.d/cf-ip-speed-client
          sh -n scripts/install-openwrt.sh
          sh -n scripts/poc-upload.sh

      # Non-blocking for now: an 800-line POSIX client produces a wall of style warnings, and a
      # check that fails on day one is a check that gets deleted. Promote to blocking once the
      # intentional ones are recorded in .shellcheckrc.
      - name: ShellCheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y shellcheck
          shellcheck -s sh -e SC1091 \
            openwrt-packages/cf-ip-speed-client/files/usr/bin/cf-ip-speed-client \
            openwrt-packages/cf-ip-speed-client/files/etc/init.d/cf-ip-speed-client \
            scripts/install-openwrt.sh \
            scripts/poc-upload.sh

      - name: LuCI ASCII transport check
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path("openwrt-packages/luci-app-cf-ip-speed-client/htdocs/luci-static/resources/view/services/cf_ip_speed_client.js"),
              Path("openwrt-packages/luci-app-cf-ip-speed-client/root/usr/share/luci/menu.d/luci-app-cf-ip-speed-client.json"),
          ]
          for path in files:
              data = path.read_text(encoding="utf-8")
              bad = [(i, ch) for i, ch in enumerate(data) if ord(ch) > 127]
              if bad:
                  raise SystemExit(f"{path} contains non-ASCII characters; use unicode escapes for LuCI compatibility")
          PY
